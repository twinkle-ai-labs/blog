name: Deploy Blog

on:
  # master 에 push 되면 빌드해서 gh-pages 로 배포한다
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # CNAME(blog.twinklelabs.kr)은 public/CNAME 이 dist 에 복사되어 함께 배포된다
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
