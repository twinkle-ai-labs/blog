<header class="header">
    <div class="titlebar">
        <div class="titlebar-left">
            <div class="traffic-lights" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <button class="tool-btn sidebar-toggle" data-role="action" data-action="sidebar"
                    aria-label="{{ _('폴더 목록 열기/닫기') }}" title="{{ _('폴더 목록') }}">
                <i class="fas fa-columns"></i>
            </button>
            <a class="titlebar-title" href="{{ SITEURL }}/">
                <span class="name">{{ SITENAME }}</span>
                <span class="count">{% trans count=articles|length %}{{ count }}개의 메모{% pluralize %}{{ count }}개의 메모{% endtrans %}</span>
            </a>
        </div>

        <div class="titlebar-right">
            <button type="button" class="search-trigger" data-role="search-open" aria-label="{{ _('검색 열기') }}">
                <i class="fas fa-search"></i>
                <span class="search-trigger-label">{{ _('검색') }}</span>
                <kbd class="search-trigger-key">⌘K</kbd>
            </button>
            {# 언어 선택 — 네이티브 <select> 는 OS 가 그리므로 직접 만든다.
               읽던 글에 번역본이 있으면 그 글로, 없으면 그쪽 사이트의 첫 화면으로 보낸다. #}
            {% if lang_siteurls is defined and lang_siteurls|length > 1 %}
                {% set here = article if article is defined else (page if page is defined else None) %}
                {% set now = LANGUAGE_NAMES.get(DEFAULT_LANG, {}) %}
                <div class="lang-select" data-role="lang-select">
                    <button type="button" class="lang-select-trigger" data-role="lang-toggle"
                            aria-haspopup="true" aria-expanded="false" aria-label="{{ _('언어 바꾸기') }}">
                        <span class="lang-flag" aria-hidden="true">{{ now.get('flag', '') }}</span>
                        <span class="lang-name">{{ now.get('name', DEFAULT_LANG|upper) }}</span>
                        <i class="fas fa-chevron-down lang-caret" aria-hidden="true"></i>
                    </button>
                    <ul class="lang-select-menu" role="menu" hidden>
                        {% for code, url in lang_siteurls.items() %}
                            {% set meta = LANGUAGE_NAMES.get(code, {}) %}
                            {% set ns = namespace(href=url ~ '/') %}
                            {% if here %}
                                {% for translation in here.translations if translation.lang == code %}
                                    {% set ns.href = SITEURL ~ '/' ~ translation.url %}
                                {% endfor %}
                            {% endif %}
                            <li role="none">
                                <a role="menuitem" href="{{ ns.href }}" hreflang="{{ code }}" lang="{{ code }}"
                                   {% if code == DEFAULT_LANG %}aria-current="true" class="is-current"{% endif %}>
                                    <span class="lang-flag" aria-hidden="true">{{ meta.get('flag', '') }}</span>
                                    <span class="lang-name">{{ meta.get('name', code|upper) }}</span>
                                    {% if code == DEFAULT_LANG %}
                                        <i class="fas fa-check lang-check" aria-hidden="true"></i>
                                    {% endif %}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
            <button class="tool-btn" data-role="action" data-action="theme" aria-label="{{ _('테마 변경') }}">
                <img src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/images/icon_moon.svg" alt="" class="theme-dark">
                <img src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/images/icon_sun.svg" alt="" class="theme-white">
            </button>
        </div>
    </div>
</header>
<div class="sidebar-backdrop" data-role="action" data-action="sidebar-close"></div>

{# 전역 검색 모달 — 어느 페이지에서든 ⌘K / Ctrl+K 로 연다. #}
<div class="search-modal" data-role="search-modal" hidden>
    <div class="search-modal-backdrop" data-role="search-close"></div>
    <div class="search-modal-panel" role="dialog" aria-modal="true" aria-label="{{ _('메모 검색') }}">
        <div class="search-modal-field">
            <i class="fas fa-search"></i>
            <input type="text" id="search-modal-input" placeholder="{{ _('메모 검색…') }}" autocomplete="off"
                   aria-label="{{ _('검색어') }}">
            <kbd>ESC</kbd>
        </div>
        <ul class="search-modal-results" id="search-modal-results"></ul>
        <p class="search-modal-empty" hidden>{{ _('검색 결과가 없어요. 다른 검색어로 시도해보세요.') }}</p>
    </div>
</div>

{# 검색 인덱스 — 사이트가 작아 전 글을 인라인 JSON 으로 싣는다. #}
<script type="application/json" id="search-index">
[
{%- for a in articles -%}
    {"title": {{ a.title|striptags|tojson }},
     "url": "{{ SITEURL }}/{{ a.url }}",
     "category": {{ a.category|string|tojson if a.category else '""' }},
     "tags": {{ a.tags|map('string')|list|tojson if a.tags else '[]' }},
     "summary": {{ a.summary|striptags|tojson if a.summary else '""' }},
     "date": "{{ a.locale_date }}"}{{ "," if not loop.last }}
{%- endfor -%}
]
</script>
